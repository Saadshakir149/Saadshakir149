<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .m { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .b1 { animation: drift 9s ease-in-out infinite alternate; }
    .b2 { animation: drift 11s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(60px,-20px); } }
    .role { opacity: 0; animation: cycle 9s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; }
    @keyframes cycle { 0%{opacity:0;transform:translateY(8px)} 4%,30%{opacity:1;transform:translateY(0)} 34%,100%{opacity:0;transform:translateY(-8px)} }
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="b1" cx="980" cy="60" r="220" fill="url(#glow1)"/>
    <circle class="b2" cx="1120" cy="280" r="200" fill="url(#glow2)"/>

    <text x="70" y="92" class="m" font-size="18" fill="#22d3ee">&gt; hello world, I'm</text>
    <text x="68" y="160" class="f" font-size="62" font-weight="800" fill="#ffffff">Saad Shakir</text>
    <rect x="70" y="178" width="120" height="5" rx="2.5" fill="url(#accent)"/>

    <g class="m" font-size="24" fill="#c7d2fe">
      <text x="70" y="228" class="role">Full-Stack Engineer · Node.js / React / TypeScript</text>
      <text x="70" y="228" class="role r2">AI &amp; HCI Researcher · LLM-powered systems</text>
      <text x="70" y="228" class="role r3">Co-founder · Brightstack SaaS</text>
    </g>

    <g transform="translate(860 110)" class="m" font-size="15">
      <rect width="270" height="120" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="20" cy="20" r="5" fill="#ff5f57"/><circle cx="38" cy="20" r="5" fill="#febc2e"/><circle cx="56" cy="20" r="5" fill="#28c840"/>
      <text x="20" y="54" fill="#94a3b8">status:</text><text x="96" y="54" fill="#4ade80">open to work</text>
      <text x="20" y="78" fill="#94a3b8">based:</text><text x="96" y="78" fill="#e2e8f0">Multan, PK</text>
      <text x="20" y="102" fill="#94a3b8">focus:</text><text x="96" y="102" fill="#e2e8f0">full-stack + AI</text>
    </g>
  </g>
</svg>
